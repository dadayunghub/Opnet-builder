name: OP_NET Build Artifact

on:
  workflow_dispatch:

jobs:
  build-opnet:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: npm

      - name: Clone OP_NET repo
        run: git clone https://github.com/btc-vision/opnet.git opnet-sdk

      - name: Install OP_NET dependencies
        run: |
          cd opnet-sdk
          npm install

      - name: Build OP_NET SDK
        run: |
          cd opnet-sdk
          npm run build

      - name: Upload OP_NET build artifact
        uses: actions/upload-artifact@v4
        with:
          name: opnet-build
          path: opnet-sdk/build
